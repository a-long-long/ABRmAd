[package]
name = "abrmad-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "abrmad_core"
path = "src/lib.rs"

[features]
# Debug 导出（ranges.json / 频谱 PNG），仅命令行调试用
cli = ["dep:serde_json", "dep:image"]
# GPU 加速：wgpu 批量计算余弦相似度，未启用时走 CPU
gpu = ["dep:wgpu", "dep:bytemuck", "pollster"]

[dependencies]
abrmad-audio = { path = "../abrmad-audio" }

# FFT 计算
rustfft = "6.2"
num-complex = "0.4"

# 数组/矩阵运算
ndarray = "0.16"
ndarray-rand = "0.15"
rand = "0.8"

# WAV 文件读写
hound = "3.5"

# 并行计算
rayon = "1.10"

# 序列化（模型持久化）
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# 错误处理
anyhow = "1.0"

# GPU 计算（仅 gpu feature）
wgpu = { version = "0.20", optional = true }
bytemuck = { version = "1.16", features = ["derive"], optional = true }
pollster = { version = "0.3", optional = true }

# Debug 导出（仅 cli feature）
serde_json = { version = "1", optional = true }
image = { version = "0.25", optional = true }

[dev-dependencies]
# WGSL 离线语法与类型校验：无 GPU 环境也能验证 shader 合法性
naga = { version = "0.20", features = ["wgsl-in"] }
