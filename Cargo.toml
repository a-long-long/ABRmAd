[workspace]
members = ["crates/abrmad-core", "crates/abrmad-audio", "crates/abrmad-ffi"]
resolver = "2"

[package]
name = "abrmad-rs"
version = "0.1.0"
edition = "2021"

# 应用层库（CLI / GUI 共用），对外引擎 DLL 由 crates/abrmad-ffi 产出
[lib]
name = "abrmad_rs_app"
crate-type = ["rlib"]

[[bin]]
name = "abrmad-cli"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "abrmad-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
cli = ["clap", "indicatif", "serde_json", "image", "abrmad-core/cli"]
gui = ["eframe", "egui", "rfd", "pollster", "env_logger", "rodio"]
# GPU 加速（可选）：使用 wgpu 在显卡上批量计算余弦相似度，未启用时走 CPU
gpu = ["abrmad-core/gpu"]

[dependencies]
abrmad-core = { path = "crates/abrmad-core" }
abrmad-audio = { path = "crates/abrmad-audio" }

# 数组运算（界面绘制）
ndarray = "0.16"
rand = "0.8"

# 错误处理
anyhow = "1.0"

# 命令行参数 (仅 bin)
clap = { version = "4.5", features = ["derive"], optional = true }

# 进度条 (仅 bin)
indicatif = { version = "0.17", optional = true }

# GUI (仅 gui bin)
eframe = { version = "0.28", optional = true }
egui = { version = "0.28", optional = true }
rfd = { version = "0.14", optional = true }
pollster = { version = "0.3", optional = true }
env_logger = { version = "0.11", optional = true }
rodio = { version = "0.20", optional = true }

# Debug 导出：ranges.json / PNG 频谱（仅 cli feature）
serde_json = { version = "1", optional = true }
image = { version = "0.25", optional = true }

[target.'cfg(windows)'.dependencies]
# 状态栏 CPU / GPU 占用率采样
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# 开发/测试构建：只保留行号表，显著减小 debuginfo（target 体积大头），
# panic 回溯与基础断点仍可用，仅变量查看能力略降
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 剥离符号，进一步减小发布产物（exe / dll / so）
strip = true

# 本机快速发布构建：thin LTO + 多 codegen 单元，编译更快，运行时略慢
[profile.quick]
inherits = "release"
lto = "thin"
codegen-units = 16
